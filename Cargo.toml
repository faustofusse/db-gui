[workspace]
resolver = "2"
members = ["crates/dbcore", "crates/dbcore-ffi", "tools/uniffi-bindgen"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
dbcore = { path = "crates/dbcore" }
uniffi = "0.32"
tokio = { version = "1", default-features = false }
async-trait = "0.1"
thiserror = "2"
regex = "1"
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = "0.14"
# ring backend: no cmake/NASM needed (aws-lc-rs would need them on Linux)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
webpki-roots = "1"
# MySQL/MariaDB: rustls with the ring provider (no aws-lc / cmake), pure-Rust zlib
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
# SQLite: compiles the bundled amalgamation, no system libsqlite3 needed
rusqlite = { version = "0.40", features = ["bundled", "column_decltype"] }
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
percent-encoding = "2"
tempfile = "3"
# SQL syntax highlighting (grammar: github.com/DerekStride/tree-sitter-sql)
tree-sitter = "0.27"
tree-sitter-sequel = "0.3"

[profile.release]
lto = "thin"
